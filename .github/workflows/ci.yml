name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build macOS arm64 app
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Build release app bundle
        shell: bash
        run: |
          set -euo pipefail
          ./create-app.sh release "${RUNNER_TEMP}/NotifyMeHow.app"
          "${RUNNER_TEMP}/NotifyMeHow.app/Contents/MacOS/NotifyMeHow" --help
